services:
  commute-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moveinsync-commute-assistant
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LLM_PROVIDER=${LLM_PROVIDER:-fake}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-4.0}
      - JWT_SECRET=moveinsync-campus-case-study-b-secure-jwt-key-2026
      - DEFAULT_RETRIEVAL_MODE=hybrid
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
